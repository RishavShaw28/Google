<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="./images/Googlelogo.webp">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-left">
            <ul>
                <li><a href="">About</a></li>
                <li><a href="">Store</a></li>
            </ul>
        </div>
        <div class="header-right">
            <ul>
                <li><a href="">Gmail</a></li>
                <li><a href="">Images</a></li>
                <li><a href=""><img src="./images/menuIcon.png" alt="Menu Icon"></a></li>
                <li><button>Sign In</button></li>
            </ul>
        </div>
    </header>

    <div class="main">
        <img src="./images/google.png" alt="Google Logo">
         <div class="searchBox">
            <input type="text" class="search">
            <div class="icons">
                <div>
                    <img src="./images/search.png" alt="Search Icon">
                </div>
                <div class="miclens">
                    <img src="./images/mic.png" alt="Mic Icon">
                    <img src="./images/googlelens.png" alt="Google Lens Icon">
                </div>
            </div>
        </div> 
        
        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
        <ul class="languages">
            <li>Google offered in:</li>
            <li><a href="">हिन्दी</a></li>
            <li><a href="">বাংলা</a></li>
            <li><a href="">తెలుగు</a></li>
            <li><a href="">मराठी</a></li>
            <li><a href="">தமிழ்</a></li>
            <li><a href="">ગુજરાતી</a></li>
            <li><a href="">ಕನ್ನಡ</a></li>
            <li><a href="">മലയാളം</a></li>
            <li><a href="">ਪੰਜਾਬੀ</a></li>
        </ul>
    </div>

    <div class="footer">
        <div class="row">
            <p class="country">India</p>
        </div>
        <div class="row row2">
            <ul>
                <li><a href="">Advertising</a></li>
                <li><a href="">Business</a></li>
                <li><a href="">How Search works</a></li>
            </ul>
            <ul>
                <li><a href="">Privacy</a></li>
                <li><a href="">Terms</a></li>
                <li><a href="">Settings</a></li>
            </ul>
        </div>
    </div>
</body>

</html>
